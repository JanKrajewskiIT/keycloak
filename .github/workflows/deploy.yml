name: Deploy Keycloak

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Copy files to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,realms/,themes/"
          target: "/opt/keycloak"
          timeout: 60s

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: KEYCLOAK_ADMIN,KEYCLOAK_ADMIN_PASSWORD
          script: |
            set -euo pipefail
            cd /opt/keycloak

            # Create .env
            cat > .env <<EOF
            KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
            KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
            EOF

            # Ensure proxy network exists (should already be created by Traefik)
            docker network inspect proxy >/dev/null 2>&1 || docker network create proxy

            # Pull and deploy
            docker compose pull
            docker compose up -d --remove-orphans

            # Cleanup
            docker image prune -f
            docker compose ps

      - name: Smoke test
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "Waiting for Keycloak to become healthy..."
            echo "Note: first start after config change includes Quarkus augmentation (~2-3 min)"
            for i in $(seq 1 60); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' keycloak 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                echo "Keycloak is healthy."
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "ERROR: Keycloak did not become healthy within 300s"
                docker ps --filter "name=keycloak" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
                docker logs keycloak --tail 20
                exit 1
              fi
              echo "  Attempt $i/60: status=$STATUS"
              sleep 5
            done

            echo "Checking HTTPS endpoint via Traefik (cert may take a moment)..."
            sleep 30
            curl -sf --retry 5 --retry-delay 15 --max-time 15 https://auth.bluebraces.online/realms/master > /dev/null && echo "Keycloak HTTPS: OK (valid cert)" || \
            curl -sf --retry 3 --retry-delay 10 --max-time 15 -k https://auth.bluebraces.online/realms/master > /dev/null && echo "Keycloak HTTPS: OK (cert pending, Traefik routing works)" || \
            { echo "ERROR: Keycloak not reachable via HTTPS"; curl -v https://auth.bluebraces.online/realms/master 2>&1 | tail -20; exit 1; }

            echo "Smoke test completed."
