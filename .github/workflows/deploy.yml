name: Deploy Keycloak

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,themes,realms"
          target: "/opt/keycloak"
          timeout: 120s

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: KEYCLOAK_ADMIN,KEYCLOAK_ADMIN_PASSWORD
          script: |
            set -euo pipefail
            cd /opt/keycloak

            # Create .env
            cat > .env <<EOF
            KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
            KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
            EOF

            # Ensure proxy network exists (should already be created by Traefik)
            docker network inspect proxy >/dev/null 2>&1 || docker network create proxy

            # Pull and deploy
            docker compose pull
            docker compose up -d --remove-orphans

            # Wait for health check
            echo "Waiting for Keycloak to become healthy..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' keycloak 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                echo "Keycloak is healthy."
                break
              fi
              echo "  Attempt $i/30: status=$STATUS"
              sleep 10
            done

            echo "Keycloak deployed successfully."
            docker compose ps
