name: Deploy Keycloak

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,KEYCLOAK_ADMIN,KEYCLOAK_ADMIN_PASSWORD
          script: |
            set -euo pipefail

            REPO_URL="https://${GHCR_TOKEN}@github.com/JanKrajewskiIT/keycloak.git"
            DEPLOY_DIR="/opt/keycloak"

            # Clone or pull the repo
            if [ -d "${DEPLOY_DIR}/.git" ]; then
              cd "${DEPLOY_DIR}"
              git remote set-url origin "${REPO_URL}"
              git fetch origin main
              git reset --hard origin/main
            else
              rm -rf "${DEPLOY_DIR}"
              git clone --depth 1 --branch main "${REPO_URL}" "${DEPLOY_DIR}"
              cd "${DEPLOY_DIR}"
            fi

            # Create .env (not tracked in git)
            cat > .env <<EOF
            KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
            KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
            EOF

            # Ensure proxy network exists (should already be created by Traefik)
            docker network inspect proxy >/dev/null 2>&1 || docker network create proxy

            # Pull and deploy
            docker compose pull
            docker compose up -d --remove-orphans

            # Wait for health check
            echo "Waiting for Keycloak to become healthy..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' keycloak 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                echo "Keycloak is healthy."
                break
              fi
              echo "  Attempt $i/30: status=$STATUS"
              sleep 10
            done

            echo "Keycloak deployed successfully."
            docker compose ps
