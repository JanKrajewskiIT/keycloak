name: Deploy Keycloak

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v6

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/keycloak"
          timeout: 60s

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: KEYCLOAK_ADMIN,KEYCLOAK_ADMIN_PASSWORD
          script: |
            set -euo pipefail
            cd /opt/keycloak

            # Create .env
            cat > .env <<EOF
            KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
            KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
            EOF

            # Ensure proxy network exists (should already be created by Traefik)
            docker network inspect proxy >/dev/null 2>&1 || docker network create proxy

            # Pull and deploy
            docker compose pull
            docker compose up -d --remove-orphans

            # Cleanup
            docker image prune -f
            docker compose ps

      - name: Smoke test
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "Waiting for Keycloak to become healthy..."
            for i in $(seq 1 24); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' keycloak 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                echo "Keycloak is healthy."
                break
              fi
              if [ "$i" -eq 24 ]; then
                echo "ERROR: Keycloak did not become healthy within 120s"
                docker ps --filter "name=keycloak" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
                exit 1
              fi
              echo "  Attempt $i/24: status=$STATUS"
              sleep 5
            done

            echo "Checking HTTPS endpoint via Traefik..."
            curl -sf --retry 3 --retry-delay 5 --max-time 10 https://auth.bluebraces.online/health/ready > /dev/null && echo "Keycloak: OK" || { echo "ERROR: Keycloak not reachable via HTTPS"; exit 1; }

            echo "Smoke test completed."
